name: check

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: HEIC と AVIF に使うコマンドを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265 ffmpeg
          heif-dec --version
          ffmpeg -version
      - run: bun run check --all
      - name: client の CLI を、ビルドした形で1回流す
        working-directory: packages/client
        env:
          ANALEMMA_DEPLOY_TOKEN: AAAAAAAAAAAAAAAAAAAAAA.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
        run: |
          bun run build
          bin="$PWD/$(node -p 'require("./package.json").bin.analemma')"
          chmod +x "$bin"
          cd "$(mktemp -d)"
          echo 'export default [{ definition: { name: "Not Kebab", label: "ページ", fields: [] } }];' > kinds.mjs
          status=0
          "$bin" push-kinds kinds.mjs --url http://127.0.0.1:9 2> errors.txt || status=$?
          cat errors.txt
          test "$status" -eq 1
          grep -q '種類の定義を読めない' errors.txt
          grep -q '^0\.name: ' errors.txt
